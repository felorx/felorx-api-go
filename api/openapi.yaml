  /api/app/notification/bark/{apiKey}/{message}:
    get:
      operationId: Bark
      parameters:
      - description: "Bark apiKey, 需要申请，注意不要泄露，泄露后产生安全问题请及时移除或禁用 apiKey"
        explode: false
        in: path
        name: apiKey
        required: true
        schema:
          type: string
        style: simple
      - description: 消息内容
        explode: false
        in: path
        name: message
        required: true
        schema:
          type: string
        style: simple
      - description: 携带参数 automaticallyCopy=1， 收到推送时，推送内容会自动复制到粘贴板（如发现不能自动复制，可尝试重启一下手机）
        explode: true
        in: query
        name: automaticallyCopy
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: 携带copy参数， 则上面两种复制操作，将只复制copy参数的值
        explode: true
        in: query
        name: copy
        required: false
        schema:
          type: string
        style: form
      - description: 点击推送将跳转到url的地址（发送时，URL参数需要编码）
        explode: true
        in: query
        name: url
        required: false
        schema:
          type: string
        style: form
      - description: 指定是否需要保存推送信息到历史记录，1 为保存，其他值为不保存。\n如果不指定这个参数，推送信息将按照APP内设置来决定是否保存。
        explode: true
        in: query
        name: isArchive
        required: false
        schema:
          type: string
        style: form
      - description: 指定推送消息分组，可在历史记录中按分组查看推送。
        explode: true
        in: query
        name: group
        required: false
        schema:
          type: string
        style: form
      - description: "指定推送消息图标, icon (仅 iOS15 或以上支持）"
        explode: true
        in: query
        name: icon
        required: false
        schema:
          type: string
        style: form
      - description: 设置时效性通知 active：不设置时的默认值，系统会立即亮屏显示通知。\ntimeSensitive：时效性通知，可在专注状态下显示通知。\npassive：仅将通知添加到通知列表，不会亮屏提醒
